name: Flutter Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Android & Web
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build-apk.outputs.apk }}
      aab_path: ${{ steps.build-aab.outputs.aab }}
      web_path: ${{ steps.build-web.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        id: build-apk
        run: |
          flutter build apk --release
          echo "apk-path=$(pwd)/Application/build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT

      - name: Build Android App Bundle
        id: build-aab
        run: |
          flutter build appbundle --release
          echo "aab-path=$(pwd)/Application/build/app/outputs/bundle/release/app.aab" >> $GITHUB_OUTPUT

      - name: Build Web
        id: build-web
        run: |
          flutter build web --release
          echo "web-path=$(pwd)/Application/build/web" >> $GITHUB_OUTPUT

      - name: Save artifacts (web)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: Application/build/web

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Application/build/windows/x64/Release

  release:
    name: Create or Update Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows

      - name: Download Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build artifacts for latest version"
          draft: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android APK to release
        uses: softprops/action-gh-release@v1
        with:
          files: android/*.apk, android/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build to release
        uses: softprops/action-gh-release@v1
        with:
          files: Application/build/windows/x64/Release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Web build to release
        uses: softprops/action-gh-release@v1
        with:
          files: web/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
