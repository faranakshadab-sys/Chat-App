name: Flutter Release (Android, Windows, Web)

on:
    push:
        branches: ["main", "master"]
    workflow_dispatch:

jobs:
    build-linux:
        name: Build Android & Web
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable

            - name: Enable Web
              run: flutter config --enable-web

            - name: Get dependencies
              run: |
                  cd Application
                  flutter pub get

            - name: Build Android APK
              run: |
                  cd Application
                  flutter build apk --release
                  mkdir -p dist
                  cp Application/build/app/outputs/flutter-apk/app-release.apk dist/

            - name: Build Android App Bundle (AAB)
              run: |
                  cd Application
                  flutter build appbundle --release
                  mkdir -p dist
                  cp Application/build/app/outputs/bundle/release/app.aab dist/

            - name: Build Web
              run: |
                  cd Application  
                  flutter build web --release

            - name: Upload Android artifacts (APK + AAB)
              uses: actions/upload-artifact@v4
              with:
                  name: android-build
                  path: dist
                  if-no-files-found: error

            - name: Upload Web artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: web-build
                  path: Application/build/web
                  if-no-files-found: error

    build-windows:
        name: Build Windows
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable

            - name: Enable Windows desktop
              run: flutter config --enable-windows-desktop

            - name: Get dependencies
              working-directory: Application
              run: flutter pub get

            - name: Build Windows
              working-directory: Application
              run: flutter build windows --release

            - name: Upload Windows build
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build
                  path: Application/build/windows/x64/Release
                  if-no-files-found: error

    release:
        name: Create or Update Release
        runs-on: ubuntu-latest
        needs: [build-linux, build-windows]

        steps:
            - name: Download Android artifacts
              uses: actions/download-artifact@v4
              with:
                  name: android-build
                  path: android

            - name: Download Windows artifacts
              uses: actions/download-artifact@v4
              with:
                  name: windows-build
                  path: windows

            - name: Download Web artifacts
              uses: actions/download-artifact@v4
              with:
                  name: web-build
                  path: web

            - name: Create or update release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: latest
                  name: Latest Build
                  body: "Automated build artifacts for latest version"
                  draft: false
                  overwrite: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Android APK & AAB to release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      android/*.apk
                      android/*.aab
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Windows build to release
              uses: softprops/action-gh-release@v1
              with:
                  files: windows/**
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Web build to release
              uses: softprops/action-gh-release@v1
              with:
                  files: web/**
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
